[package]
name = "pmmlruntime-web"
version = "0.1.1"
edition = "2021"
description = "pmmlruntime Web WASM shim over include/pmml_runtime.h PmmlApi (like onnxruntime/js/web)"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
pmmlruntime = { path = "../../crates/pmmlruntime" }

# getrandom has no default backend on wasm32-unknown-unknown. The 0.3 line needs the
# wasm_js feature plus the rustflag in the repo .cargo/config.toml; the 0.2 line is
# pulled in by ahash/rand_core and needs its own js feature.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

[profile.release]
lto = true
opt-level = "z"
