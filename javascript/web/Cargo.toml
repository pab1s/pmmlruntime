[package]
name = "pmmlruntime-web"
version = "0.1.0"
edition = "2021"
description = "pmmlruntime Web WASM shim over include/pmml_runtime.h PmmlApi (like onnxruntime/js/web)"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
lto = true
opt-level = "z"
