# cbindgen.toml — generate include/pmml_runtime.h from crates/pmmlruntime/src/ffi
language = "C"
include_guard = "PMML_RUNTIME_H"
autogen_warning = "/* Warning: generated by cbindgen from Rust ffi — do not edit. */"
sys_includes = ["stddef.h", "stdint.h"]
include_version = true
braces = "SameLine"
line_length = 100
tab_width = 2

[parse]
parse_deps = false
include = ["pmmlruntime"]

[export]
include = ["PmmlApi", "PmmlEnv", "PmmlSession", "PmmlSessionOptions", "PmmlRunOptions", "PmmlIoBinding", "PmmlStatus", "PmmlValue", "PmmlGraphOptimizationLevel", "PmmlLogLevel", "PmmlErrorCode"]
