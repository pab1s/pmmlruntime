[workspace]
members = [
  "crates/pmml-model-rs",
  "crates/pmml-evaluator-rs",
  "crates/pmml-evaluator-core",
  "crates/pmml-model-evaluators",
  "crates/pmml-evaluator-xml",
  "crates/pmml-evaluator-serde",
  "crates/pmml-evaluator-testing",
  "crates/pmml-jni-bridge",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Pablo Olivares <pablolivares1502@gmail.com>"]
repository = "https://github.com/pab1s/jpmml-evaluator-rs"
rust-version = "1.78"

[workspace.dependencies]
quick-xml = { version = "0.36", features = ["serde", "serialize"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
indexmap = "2.9"
bimap = "0.6"
rangemap = "1.6"
moka = { version = "0.12", features = ["sync"] }
statrs = "0.17"
libm = "0.2"
ndarray = "0.16"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.11"
criterion = "0.5"
