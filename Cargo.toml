[workspace]
members = ["crates/pmmlruntime", "crates/pmml-cli", "crates/pmml-bench"]
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Pablo Olivares <pablolivares1502@gmail.com>"]
repository = "https://github.com/pab1s/pmmlruntime"
rust-version = "1.78"

[workspace.dependencies]
quick-xml = { version = "0.37", features = ["serialize"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
indexmap = "2.9"
lasso = "0.7"
bumpalo = { version = "3", features = ["collections"] }
smallvec = { version = "1", features = [] }
ahash = "0.8"
memchr = "2"
parking_lot = "0.12"
arrow = { version = "53", features = ["csv"] }
rayon = "1.10"
statrs = "0.17"
libm = "0.2"
ndarray = "0.16"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.11"
criterion = { version = "0.5", features = ["html_reports"] }
insta = "1"
proptest = "1"
pyo3 = { version = "0.22", features = ["extension-module"] }
wide = { version = "0.7", features = [] }
