[package]
name = "fuzz"
version = "0.1.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
pmmlruntime = { path = "../crates/pmmlruntime" }

# Use --fuzzing with `cargo fuzz run fuzz_unmarshal`
[[bin]]
name = "fuzz_unmarshal"
path = "fuzz_targets/fuzz_unmarshal.rs"
test = false
doc = false
