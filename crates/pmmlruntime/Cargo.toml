[package]
name = "pmmlruntime"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage = "https://github.com/pab1s/pmmlruntime"
documentation = "https://docs.rs/pmmlruntime"
readme = "../../README.md"
rust-version.workspace = true
description = "PMML 4.4 runtime — session-based execution, Arrow batch, hardened XML"
keywords = ["pmml", "scoring", "machine-learning"]
categories = ["science"]
include = ["src/**/*", "examples/**/*", "tests/**/*", "Cargo.toml", "../../README.md", "../../LICENSE"]

[dependencies]
quick-xml = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
indexmap = { workspace = true }
lasso = { workspace = true }
bumpalo = { workspace = true }
smallvec = { workspace = true }
ahash = { workspace = true }
memchr = { workspace = true }
parking_lot = { workspace = true }
arrow = { workspace = true }
rayon = { workspace = true }
statrs = { workspace = true }
libm = { workspace = true }
ndarray = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }
proptest = { workspace = true }
pyo3 = { workspace = true, optional = true }
wide = { workspace = true, optional = true }

[features]
default = []
simd = ["dep:wide"]
python = ["dep:pyo3"]
